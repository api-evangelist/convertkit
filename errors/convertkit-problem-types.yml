envelope:
  media_type: application/json
  shape: '{"errors": ["Human-readable message", ...]}'
  fields:
  - name: errors
    type: array of string
    description: >-
      The only documented field. Kit V4 returns a single top-level `errors`
      array of human-readable strings — there is no machine-readable error
      `code`, `type` URI, `title`, `detail`, or `instance`. An agent cannot
      branch on a stable error identifier; it can only branch on the HTTP status
      and string-match the message.
  note: >-
    Not RFC 9457. No application/problem+json response appears anywhere in the
    72-operation spec; every 4xx/5xx body is application/json carrying this
    envelope. Recorded as the gap it is.
