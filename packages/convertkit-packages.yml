note: >-
  Kit publishes exactly ONE first-party server-side API SDK — the PHP SDK. There
  is no official JavaScript, Python, Ruby, Go, Java, or .NET client for the v4
  API; the developer docs do not link one, and every npm/PyPI/RubyGems package
  matching "convertkit"/"kit api" is either third-party or a front-end form
  embed. Recorded as an honest gap rather than padded with community libraries.
