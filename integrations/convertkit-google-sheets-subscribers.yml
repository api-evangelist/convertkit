arazzo: 1.0.1
info:
  title: 'Kit Google Sheets: add subscribers from rows'
  summary: Add subscribers to Kit from new Google Sheets spreadsheet rows.
  description: Add subscribers to Kit from new Google Sheets spreadsheet rows. Recreated
    from the Zapier template that names Kit and google-sheets; every operationId is
    copied from the catalog specs.
  version: 1.0.0
x-integration:
  partner: google-sheets
  template: https://zapier.com/apps/google-sheets/integrations/kit/60847/add-subscribers-to-kit-from-new-google-sheets-spreadsheets-rows
  edge_evidence: https://zapier.com/apps/google-sheets/integrations/kit/60847/add-subscribers-to-kit-from-new-google-sheets-spreadsheets-rows
  edge_type: marketplace
  method: generated
  generated: '2026-10-12'
  generator: claude-enrich local-v5
  guessed_steps:
  - step: read-sheet-row
    cause: partner-contract
    why: Column order is the user sheet layout; email in column A and name in column
      B is an assumption.
sourceDescriptions:
- name: googleSheetsValues
  url: https://raw.githubusercontent.com/api-evangelist/google-sheets/refs/heads/main/openapi/google-sheets-values-api-openapi.yml
  type: openapi
- name: kitSubscribers
  url: https://raw.githubusercontent.com/api-evangelist/convertkit/refs/heads/main/openapi/convertkit-subscribers-api-openapi.yml
  type: openapi
workflows:
- workflowId: google-sheets-subscribers
  summary: Add subscribers to Kit from new Google Sheets spreadsheet rows.
  inputs:
    type: object
    properties:
      spreadsheetId:
        type: string
      range:
        type: string
    required:
    - spreadsheetId
    - range
  steps:
  - stepId: read-sheet-row
    description: Read the new row from the spreadsheet.
    operationId: $sourceDescriptions.googleSheetsValues.getValues
    parameters:
    - name: spreadsheetId
      in: path
      value: $inputs.spreadsheetId
    - name: range
      in: path
      value: $inputs.range
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      email: $response.body#/values/0/0
      name: $response.body#/values/0/1
  - stepId: upsert-kit-subscriber
    description: Create or update the Kit subscriber (upsert on email_address).
    operationId: $sourceDescriptions.kitSubscribers.postV4Subscribers
    requestBody:
      contentType: application/json
      payload:
        email_address: $steps.read-sheet-row.outputs.email
        first_name: $steps.read-sheet-row.outputs.name
    successCriteria:
    - condition: $statusCode == 201 || $statusCode == 200
    outputs:
      subscriberId: $response.body#/subscriber/id
  outputs:
    subscriberId: $steps.upsert-kit-subscriber.outputs.subscriberId
