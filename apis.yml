aid: convertkit
name: Kit
description: Kit (formerly ConvertKit) is a creator email marketing platform with
  a REST API for managing subscribers, tags, sequences, forms, broadcasts, and automation
  rules. The API supports both API key and OAuth 2.0 authentication, with v4 as the
  current version featuring cursor-based pagination, bulk operations, and async processing.
