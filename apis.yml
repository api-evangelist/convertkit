aid: convertkit
name: Kit
description: Kit (formerly ConvertKit) is a creator email marketing platform whose REST API v4 covers
  subscribers, tags, custom fields, forms and landing pages, sequences, broadcasts, snippets, posts, purchases,
  segments and webhooks across 72 operations on https://api.kit.com/v4. It authenticates with an X-Kit-Api-Key
  header for personal automation or OAuth 2.0 (PKCE, dynamic client registration, rotating single-use
  refresh tokens) for apps published to the Kit App Store, and uses cursor-based pagination, an OAuth-only
  bulk namespace with async callbacks, and eventually-consistent list reads. Kit also runs two remote
  MCP servers - an OAuth-gated one that acts on a creator's account and an anonymous read-only documentation
  server - publishes an A2A agent card and an Agent Skill from its developer docs host, and ships llms.txt.
  Its only first-party API client is a PHP SDK.
