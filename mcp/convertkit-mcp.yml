generated: '2026-08-13'
method: searched
status: published
source: https://developers.kit.com/mcp/overview
docs:
- https://developers.kit.com/mcp/overview
- https://developers.kit.com/mcp/kit-mcp
- https://developers.kit.com/mcp/kit-developer-docs-mcp
- https://help.kit.com/en/articles/14827557-how-to-connect-the-kit-mcp-to-your-ai-tools

deployment:
  mode: remote
  endpoint: https://app.kit.com/mcp
  auth: oauth
  verified: probed
  note: >-
    Kit ships TWO remote MCP servers and no stdio package. The primary
    (account-acting) server is https://app.kit.com/mcp; a second, anonymous,
    read-only documentation server is https://developers.kit.com/mcp. Both are
    URLs an MCP client POSTs to — there is nothing to npx or pip install.
    `endpoint` names the account server because that is the one that reaches Kit
    data; the docs server is recorded in servers[] below.

servers:
- name: Kit MCP
  key: kit-mcp
  url: https://app.kit.com/mcp
  transport: http
  auth: oauth
  scope: creator account (read + write)
  availability: Paid Kit plans only (Creator and Creator Pro)
  rate_limit: 120 requests per minute per token
  docs: https://developers.kit.com/mcp/kit-mcp
  tools_list:
    probed: '2026-08-13'
    http_status: 401
    body: '{"error":"Bearer token required"}'
    www_authenticate: Bearer resource_metadata="https://app.kit.com/.well-known/oauth-protected-resource/mcp"
    gated: true
    note: >-
      tools/list is OAuth-gated, so the live tool schemas could not be
      introspected anonymously. Kit's own docs state the server is "essentially a
      one-to-one mapping of Kit's v4 API surface — every endpoint in the API
      reference is exposed as an MCP tool", so the crosswalk in
      convertkit-tool-crosswalk.yml maps the REST surface rather than a fetched
      tool list, and marks confidence accordingly. Tool names and input schemas
      require an authenticated introspection.
  discovery:
    oauth_protected_resource: https://app.kit.com/.well-known/oauth-protected-resource
    authorization_server: https://api.kit.com
    authorization_endpoint: https://app.kit.com/oauth/authorize
    token_endpoint: https://api.kit.com/oauth/token
    registration_endpoint: https://app.kit.com/oauth/register
    dynamic_client_registration: true
    pkce: S256
    scopes_supported:
    - public
  annotations:
    documented: true
    hints:
    - readOnlyHint
    - destructiveHint
    - idempotentHint
    - openWorldHint
    note: >-
      Kit documents that every tool carries an MCP annotation hint, and that
      destructive or external actions (sending broadcasts, deleting data) always
      require explicit user confirmation in supporting clients.
- name: Kit Developer Docs MCP
  key: kit-docs
  url: https://developers.kit.com/mcp
  transport: http
  auth: none
  scope: public developer documentation (read-only, plus a feedback submission tool)
  docs: https://developers.kit.com/mcp/kit-developer-docs-mcp
  server_info:
    name: Kit Developer Documentation
    version: 1.0.0
    protocol_version: '2025-06-18'
  capabilities:
    tools:
      listChanged: true
    resources:
      listChanged: true
  tools_list:
    probed: '2026-08-13'
    http_status: 200
    gated: false
    file: convertkit-docs-mcp-tools.json
    tool_count: 3
  install_examples:
    claude_code: claude mcp add --transport http kit-docs https://developers.kit.com/mcp
    json_config: '{"mcpServers":{"kit-docs":{"url":"https://developers.kit.com/mcp"}}}'

tools:
- name: search_kit_developer_documentation
  server: kit-docs
  title: Search documentation
  description: Search across the Kit Developer Documentation knowledge base for docs, code examples and API references.
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
  source: probed tools/list (mcp/convertkit-docs-mcp-tools.json)
- name: query_docs_filesystem_kit_developer_documentation
  server: kit-docs
  description: >-
    Read-only shell-like query (rg/grep/find/tree/ls/cat/head/tail/jq) against a
    virtualized in-memory filesystem containing only the Kit developer docs pages
    and OpenAPI specs.
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
  source: probed tools/list (mcp/convertkit-docs-mcp-tools.json)
- name: submit_feedback
  server: kit-docs
  title: Submit documentation feedback
  description: Report a problem with a Kit documentation page to the docs team.
  annotations:
    readOnlyHint: false
    destructiveHint: false
    idempotentHint: false
    openWorldHint: true
  source: probed tools/list (mcp/convertkit-docs-mcp-tools.json)

notes:
- The Kit MCP tool catalogue is published in the Kit help centre, not in the developer docs; it is not machine-readable and was not fabricated here.
- Kit also ships a first-party Cursor plugin (github.com/Kit/cursor-plugin) that connects a Kit account over MCP.
