note: >-
  Derived from the 47 paths / 72 operations in Kit's OpenAPI: path nesting,
  response schema properties and the id-reference fields the spec actually
  declares (email_template_id, subscriber_id, publication_id, sequence_id,
  transaction_id, subscriber_custom_field_id, form_id, tag_id, account_id).
  Kit's ids are plain integers with no type prefix, so entity type cannot be
  inferred from an id value alone — every reference must carry its field name.
id_convention:
  type: integer
  prefixed: false
  note: >-
    Unlike prefixed-id APIs (Stripe cus_/in_), a Kit id carries no type
    information. An agent holding a bare integer cannot tell a tag_id from a
    form_id; the field name is the only type signal.
