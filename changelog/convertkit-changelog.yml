scheme: dated-entries
current_version: v4
cadence: continuous; entries are dated and tagged (API, Authentication, Analytics, Commerce, Kit App Store)
window: 2026-05-20 through 2026-07-17 (recent window only; the live changelog is the source of truth)
note: >-
  Kit runs two changelogs. This artifact captures the DEVELOPER changelog at
